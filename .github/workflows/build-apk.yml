name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(grep -m1 -E '^\s+versionName "' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
          version="${base_version}+claude.${GITHUB_RUN_NUMBER}"
          tag="terminal-claude-v${base_version}-${GITHUB_RUN_NUMBER}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="$version"
          export TERMUX_APK_VERSION_TAG="$tag"
          export TERMUX_PACKAGE_VARIANT=apt-android-7
          ./gradlew assembleDebug

          mkdir -p dist
          # Phones are arm64. The universal APK also covers x86_64 emulators and
          # Chromebooks; there's no separate x86_64 file to pick by mistake.
          cp "app/build/outputs/apk/debug/termux-app_${tag}_arm64-v8a.apk" dist/terminal-claude.apk
          cp "app/build/outputs/apk/debug/termux-app_${tag}_universal.apk" dist/terminal-claude_universal-all-devices.apk
          (cd dist && sha256sum *.apk > sha256sums.txt)
          ls -lh dist

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: terminal-claude-apks
          path: dist/*

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Terminal Claude $VERSION" \
            --notes "Built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`.

          **Which file?** Phones and tablets: \`terminal-claude.apk\`.
          If Android says the app isn't compatible, or for emulators and Chromebooks: \`terminal-claude_universal-all-devices.apk\` (bigger, works everywhere).
          Claude Code needs a 64-bit device.

          Uninstall Termux first if you have it installed (same package name, different signing key).
          On first launch the app sets up storage access, a Debian environment and Claude Code automatically.
          See the README for details."

  # Installs the APK on an Android emulator, lets the real first-run setup
  # install Claude Code, taps through the buttons and takes screenshots. The
  # screenshots are pushed to the ref refs/screenshots/latest (not a branch):
  #   git fetch origin refs/screenshots/latest && git checkout FETCH_HEAD
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APKs
        uses: actions/download-artifact@v5
        with:
          name: terminal-claude-apks
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/emulator-test.sh

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          [ -d screenshots ] || exit 0
          cd screenshots
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Emulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/latest
