# terminal-claude:managed
# Terminal Claude defaults. Delete the line above to keep your own edits when
# the app updates. After changing this file, run: termux-reload-settings
# All options: https://wiki.termux.com/wiki/Terminal_Settings

# Keys above the keyboard, tuned for Claude Code. Swipe up on a key for the
# second symbol shown in the comments.
#   ESC  stop Claude          ⇧TAB  switch Claude's mode (plan / auto-accept)
#   /    commands (\)         @     mention a file (#)      !  shell command (|)
#   -    (_)                  ⎘     paste                   arrows: history and menus
extra-keys = [ \
  ['ESC', {key: '/', popup: '\\\\'}, {key: '@', popup: '#'}, {key: '!', popup: '|'}, {key: '-', popup: '_'}, {key: 'HOME', popup: 'PGUP'}, 'UP', {key: 'END', popup: 'PGDN'}], \
  [{macro: 'SHIFT TAB', display: '⇧TAB'}, 'TAB', {key: 'CTRL', popup: {macro: 'CTRL c', display: '^C'}}, 'ALT', {key: 'PASTE', popup: '~'}, 'LEFT', 'DOWN', 'RIGHT'] \
]
extra-keys-text-all-caps = false

# Tap a link (like Claude's sign-in link) to open it.
terminal-onclick-url-open = true

# New tabs start in your projects folder.
default-working-directory = /data/data/com.termux/files/home/projects

night-mode = true
bell-character = ignore
terminal-cursor-style = bar
terminal-cursor-blink-rate = 600
terminal-margin-horizontal = 6
terminal-transcript-rows = 5000
